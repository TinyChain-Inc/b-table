[package]
name = "b-table"
version = "0.4.0"
authors = ["code@tinychain.net"]
edition = "2024"
description = "A persistent database table based on b-tree"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/haydnv/b-table"

keywords = ["persistent", "ordered", "indexed", "relational", "table"]
categories = ["database", "database-implementations", "data-structures"]

[features]
all = ["logging", "stream"]
logging = ["log", "b-tree/logging", "freqfs/logging"]
stream = ["b-tree/stream", "destream/smallvec"]

[[example]]
name = "example"
required-features = ["stream"]

[dependencies]
b-tree = { path = "../b-tree", version = "0.5" }
destream = { path = "../destream", version = "0.10", optional = true }
freqfs = { path = "../freqfs", version = "0.13" }
futures = "0.3"
log = { version = "0.4", features = ["release_max_level_info"], optional = true }
num_cpus = "1.17"
pin-project = "1.1"
safecast = "0.2"
smallvec = "1.15"

[dev-dependencies]
get-size = "0.1"
tbon = { path = "../tbon", version = "0.9", features = ["tokio-io"] }
destream = { path = "../destream", version = "0.10" }
number-general = { path = "../number-general", version = "0.14", features = ["stream"] }
rand = "0.10"
tokio = { version = "1.52", features = ["macros"] }
